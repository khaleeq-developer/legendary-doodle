name: Debugging Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug-job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Always runs
        run: |
          echo "This step always runs"
          echo "Event: ${{ github.event_name }}"

      - name: Step 2 - Intentional failure
        run: |
          echo "This step will fail"
          exit 1

      - name: Step 3 - Runs only if previous steps succeeded
        if: success()
        run: |
          echo "You should NOT see this message"

      - name: Step 4 - Runs only if previous step failed
        if: failure()
        run: |
          echo "Previous step failed, so this runs"

      - name: Step 5 - Always runs (cleanup style)
        if: always()
        run: |
          echo "This always runs, even after failure"
